[workspace]
resolver = "2"
members = [
    "crates/rudder-core",
    "crates/rudder-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rudder-core = { path = "crates/rudder-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "multipart",
] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# OS keychain (macOS Keychain / Windows Credential Manager / Linux Secret
# Service). keyring target-gates its own deps, so the full feature set is
# safe cross-platform (docs/ARCHITECTURE.md §4 credential discipline).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

[profile.release]
strip = true
lto = true
