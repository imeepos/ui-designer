# Rudder 自动打包发布流水线（骨架参考 p2p gui-client.yml 的实证口径）：
#   gate    —— 版本一致性 / 前端 build+test+i18n / core+cli clippy+test。快门禁，
#              main push 也跑（兼作 CI 门禁），失败不进打包矩阵
#   build   —— 三平台 Tauri 打包（macOS arm64 / Linux AppImage+deb / Windows NSIS+MSI）。
#              打包前先构建 rudder-cli 并按 target triple 落位 sidecar
#              （tauri.conf.json bundle.externalBin，docs/CLI-BORROW-PLAN.md P2），
#              安装包内即含同 commit 同版本的 CLI
#   release —— 仅 v* tag：下载产物、生成 SHA256SUMS.txt、发 GitHub Release
#              （安装包 + 按 triple 命名的裸 CLI 二进制，覆盖非 GUI 装法）
#
# 触发：手动 / v* 标签（发布）/ main push（只跑 gate）
# main push 刻意不做 paths 过滤：paths 与 tags 同块时 tag 事件可能被静默滤掉
# （发布不可静默失败，p2p 实证结论），宁可 gate 对全部 main push 运行。
#
# 与 p2p 的两处刻意差异：
#   1. 本项目 tauri.conf.json 未开启 updater，无 createUpdaterArtifacts，
#      不需要 TAURI_SIGNING_* secrets——macOS/Linux/Windows 产物均未签名。
#   2. e2e/smoke.sh 是真实生图路径（花钱），按 AGENTS.md 纪律只允许人工 --yes
#      触发，永进不了本流水线；CI 只跑 dry-run 安全路径（单测、构建、i18n）。
name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

# 同 ref 连续 push 只跑最新，防过时 run 堆积排队
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 快门禁：版本一致 + 前端 + core/cli Rust ----------
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth 0：tag 祖先校验需要全历史
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 仅 tag 触发时：tag 指向的 commit 必须已在 origin/main 历史内，
      # 防止 feature 分支未合并代码被 tag 直接发布（p2p 同款口径）
      - name: tag 祖先校验（tag 提交必须在 origin/main 上）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --prune origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "tag-gate: PASS $commit 在 origin/main 历史内"
          else
            echo "tag-gate: FAIL $commit 不在 origin/main 上，拒绝发布（tag 只允许打在已合并 main 的提交）" >&2
            exit 1
          fi

      # 三处清单（package.json / Cargo.toml workspace / tauri.conf.json）版本
      # 必须一致；tag 触发时再与 tag 名对账（v0.1.0 ↔ 0.1.0）
      - name: 版本一致性校验
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/release/check-version.mjs --expect "$GITHUB_REF_NAME"
          else
            node scripts/release/check-version.mjs
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 前端门禁：tsc + vite 产物、vitest、i18n 键位 parity 与硬编码文案扫描
      # （AGENTS.md：文案一律 i18n，两脚本即纪律的机械化执行）
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/check-i18n-keys.mjs
      - run: node scripts/check-hardcoded-text.mjs

      # Rust 门禁：src-tauri 依赖 GTK 系统库，gate 不编译它（编译正确性由
      # build 矩阵在三个平台全量覆盖）；core+cli 纯 Rust 无系统依赖，
      # clippy -D warnings 对齐 docs/PLAN.md Phase 2 验收口径
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clippy（core + cli）
        run: cargo clippy -p rudder-core -p rudder-cli --all-targets -- -D warnings
      - name: test（core + cli）
        env:
          # 无头 CI 无 OS 钥匙串：core 测试按 credential.rs 约定走 env 回退路径
          RUDDER_KEYCHAIN: "0"
        run: cargo test -p rudder-core -p rudder-cli

  # ---------- 三平台打包：gate 全绿才进；main push 只跑 gate 不打包 ----------
  build:
    needs: gate
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon（docs/PLAN.md Phase 5 验收口径：aarch64 dmg）
            args: ""
          - os: ubuntu-22.04
            args: "--bundles appimage deb"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # src-tauri 是 workspace 成员，target/ 统一在仓库根，一份缓存全覆盖
      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖（WebKit/GTK）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 构建 rudder-cli release 二进制并按 host triple 落位到
      # src-tauri/binaries/rudder-<triple>[.exe]，附带 --version 冒烟
      # （与 GUI 清单版本不一致当场失败，不浪费打包时间）。
      # -p rudder-cli 只编 core+cli，此步无需 GTK 系统依赖
      - name: 准备 sidecar CLI（rudder-<target-triple>）
        run: node scripts/release/prepare-sidecar.mjs

      # tauri build 的 beforeBuildCommand（pnpm sidecar && pnpm build）产出前端
      # dist 并就位 sidecar。externalBin 已声明，sidecar 缺失时 tauri build
      # 直接失败——机制上杜绝发布不含 CLI 的安装包
      - name: Tauri 打包
        shell: bash
        run: pnpm tauri build ${{ matrix.args }}

      # .app 是目录，upload-artifact 会被拍平成 zip、Release 端又被
      # artifacts/**/* 逐文件拆散；先按 macOS 惯例打成保留父目录的 zip，
      # Release 资产即「解压得 Rudder.app」
      - name: 打包 macOS .app 为 zip
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Rudder.app Rudder-app.zip

      - name: 上传 macOS 产物
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Rudder-macos
          path: |
            Rudder-app.zip
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 上传 Linux 产物
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: Rudder-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: 上传 Windows 产物
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Rudder-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      # 裸 CLI 二进制单独上传：Release 里供非 GUI 用户直装（triple 命名自带平台语义）
      - name: 上传裸 CLI 二进制
        uses: actions/upload-artifact@v4
        with:
          name: rudder-cli-${{ matrix.os }}
          path: src-tauri/binaries/rudder-*
          if-no-files-found: error

  # ---------- 发布：仅 v* tag；checkout 必须在下载产物之前 ----------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # 顺序教训（p2p client-v0.1.6 发布失败根因，2026-09-06 定因）：
      # checkout 的 git clean 会把未跟踪的 artifacts/ 当垃圾删除，必须先
      # checkout 再 download-artifact
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成 SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f -print0 | xargs -0 sha256sum > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
